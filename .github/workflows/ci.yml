name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: secret scan (whole history)
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --no-banner -v
      - name: tools
        run: |
          sudo apt-get install -y -qq zsh >/dev/null
          V=$(grep '^SINGBOX_VERSION=' lib/defaults.env | cut -d= -f2 | awk '{print $1}')
          curl -fsSL https://github.com/SagerNet/sing-box/releases/download/v$V/sing-box-$V-linux-amd64.tar.gz | tar -xz
          echo "SINGBOX=$PWD/sing-box-$V-linux-amd64/sing-box" >> $GITHUB_ENV
          npm install -g --silent esbuild@0.25.10   # bundles sub/worker.js the way wrangler does (SubscriptionTest)
      - name: script syntax
        run: |
          for f in lib/site.sh server/*.sh client/*/*.sh client/ios/qr.sh; do zsh -n "$f" || exit 1; done
          bash -n client/macos/root-setup.sh
          python3 -m py_compile lib/jpx.py server/render.py server/audit.py client/make-config.py
      - name: tests (+ sing-box check of every generated config)
        run: python3 -m unittest discover -s tests -v
